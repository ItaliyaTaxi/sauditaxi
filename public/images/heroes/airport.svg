    <rect x="240" y="360" width="44" height="300"/><rect x="220" y="330" width="84" height="50" rx="8"/>
    <rect x="0" y="560" width="1600" height="120"/>
  </g>
  <g fill="#f5b820" opacity="0.85"><rect x="252" y="345" width="20" height="20" rx="3"/></g>
  <!-- runway lights -->
  <g fill="#f5b820"><circle cx="400" cy="720" r="6"/><circle cx="560" cy="740" r="6"/><circle cx="720" cy="760" r="6"/><circle cx="880" cy="780" r="6"/><circle cx="1040" cy="800" r="6"/></g>
  <rect x="0" y="660" width="1600" height="240" fill="#070b14" opacity="0.55"/>
</svg>
