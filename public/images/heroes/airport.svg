<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#21304d"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0" stop-color="#f5b820" stop-opacity="0.22"/><stop offset="1" stop-color="#f5b820" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- plane -->
  <g fill="#0c1422" transform="translate(1050 230) rotate(-8)">
    <path d="M0 40 L320 20 q40 -2 40 18 q0 20 -40 18 L0 80 Z"/>
    <path d="M120 50 L60 -40 L96 -40 L200 46 Z"/><path d="M120 70 L60 160 L96 160 L200 74 Z"/>
    <path d="M330 30 L300 -16 L320 -16 L360 36 Z"/>
  </g>
