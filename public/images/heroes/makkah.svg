<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#241c2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="60%" r="55%">
      <stop offset="0" stop-color="#f5b820" stop-opacity="0.30"/><stop offset="1" stop-color="#f5b820" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- clock tower (Abraj al-Bait style) -->
  <g fill="#0c1422">
    <rect x="1080" y="180" width="160" height="540"/>
    <path d="M1080 180 q80 -90 160 0 Z"/>
    <rect x="1140" y="70" width="40" height="120"/>
  </g>
  <circle cx="1160" cy="280" r="54" fill="#0a0f1a" stroke="#f5b820" stroke-width="5"/>
  <line x1="1160" y1="280" x2="1160" y2="246" stroke="#f5b820" stroke-width="5"/>
  <line x1="1160" y1="280" x2="1188" y2="290" stroke="#f5b820" stroke-width="5"/>
  <!-- haram mosque silhouette with minarets -->
  <g fill="#0c1422">
    <rect x="200" y="520" width="760" height="200"/>
    <rect x="260" y="300" width="30" height="220"/><rect x="430" y="300" width="30" height="220"/>
    <rect x="700" y="300" width="30" height="220"/><rect x="870" y="300" width="30" height="220"/>
    <circle cx="580" cy="520" r="90"/>
  </g>
  <g fill="#f5b820" opacity="0.6"><circle cx="275" cy="300" r="10"/><circle cx="445" cy="300" r="10"/><circle cx="715" cy="300" r="10"/><circle cx="885" cy="300" r="10"/></g>
  <rect x="0" y="700" width="1600" height="200" fill="#070b14" opacity="0.6"/>
</svg>
