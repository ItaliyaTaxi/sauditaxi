<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#21304d"/></linearGradient>
    <radialGradient id="g" cx="60%" cy="40%" r="55%"><stop offset="0" stop-color="#f5b820" stop-opacity="0.26"/><stop offset="1" stop-color="#f5b820" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#b)"/><rect width="1600" height="900" fill="url(#g)"/>
  <!-- city skyline -->
  <g fill="#0c1422">
    <rect x="120" y="480" width="90" height="240"/>
    <rect x="230" y="410" width="70" height="310"/>
    <rect x="320" y="520" width="110" height="200"/>
    <rect x="450" y="360" width="60" height="360"/>
    <rect x="0" y="700" width="1600" height="120"/>
  </g>
  <!-- solo traveller figure -->
  <g fill="#f5b820" transform="translate(760 500)">
    <circle cx="0" cy="0" r="30"/>
    <rect x="-26" y="36" width="52" height="110" rx="18"/>
    <rect x="-46" y="46" width="20" height="90" rx="10" transform="rotate(-12 -36 46)"/>
    <rect x="26" y="46" width="20" height="90" rx="10" transform="rotate(12 36 46)"/>
  </g>
  <!-- shield with check -->
  <g transform="translate(1080 380)">
    <path d="M110 0 L220 40 V150 q0 110 -110 160 q-110 -50 -110 -160 V40 Z" fill="#1f8a5b"/>
    <path d="M65 118 l35 35 l70 -85" stroke="#0a0f1a" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="0" y="720" width="1600" height="180" fill="#070b14" opacity="0.55"/>
</svg>
