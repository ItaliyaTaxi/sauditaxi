<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#10283a"/></linearGradient>
    <radialGradient id="g" cx="52%" cy="55%" r="55%"><stop offset="0" stop-color="#1f8a5b" stop-opacity="0.28"/><stop offset="1" stop-color="#1f8a5b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#b)"/><rect width="1600" height="900" fill="url(#g)"/>
  <!-- city skyline -->
  <g fill="#0c1422">
    <rect x="120" y="440" width="90" height="280"/>
    <rect x="230" y="380" width="70" height="340"/>
    <rect x="1260" y="420" width="90" height="300"/>
    <rect x="1370" y="360" width="70" height="360"/>
    <rect x="0" y="700" width="1600" height="120"/>
  </g>
  <!-- adult figure -->
  <g fill="#f5b820" transform="translate(720 520)">
    <circle cx="0" cy="0" r="30"/>
    <rect x="-26" y="36" width="52" height="110" rx="18"/>
  </g>
  <!-- elderly figure with cane -->
  <g fill="#f5b820" transform="translate(850 540)">
    <circle cx="0" cy="0" r="26"/>
    <rect x="-22" y="32" width="44" height="96" rx="16"/>
    <rect x="30" y="40" width="10" height="110" rx="5" transform="rotate(18 30 40)"/>
  </g>
  <rect x="0" y="720" width="1600" height="180" fill="#070b14" opacity="0.55"/>
</svg>
