<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#21304d"/></linearGradient>
    <radialGradient id="g" cx="60%" cy="35%" r="55%"><stop offset="0" stop-color="#f5b820" stop-opacity="0.24"/><stop offset="1" stop-color="#f5b820" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#b)"/><rect width="1600" height="900" fill="url(#g)"/>
  <!-- city skyline -->
  <g fill="#0c1422">
    <rect x="140" y="460" width="90" height="260"/>
    <rect x="250" y="400" width="70" height="320"/>
    <rect x="340" y="500" width="110" height="220"/>
    <rect x="0" y="700" width="1600" height="120"/>
  </g>
  <!-- shield -->
  <g transform="translate(1000 320)">
    <path d="M130 0 L260 46 V176 q0 130 -130 190 q-130 -60 -130 -190 V46 Z" fill="#0c1422" stroke="#f5b820" stroke-width="8"/>
  </g>
  <!-- warning triangle inside shield -->
  <g transform="translate(1060 400)">
    <path d="M70 0 L140 120 H0 Z" fill="#f5b820"/>
    <rect x="62" y="40" width="16" height="50" rx="6" fill="#0a0f1a"/>
    <circle cx="70" cy="104" r="10" fill="#0a0f1a"/>
  </g>
  <rect x="0" y="720" width="1600" height="180" fill="#070b14" opacity="0.55"/>
</svg>
