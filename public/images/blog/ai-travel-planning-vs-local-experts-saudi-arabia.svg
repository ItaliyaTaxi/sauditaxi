    <radialGradient id="g" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#3ab0f5" stop-opacity="0.22"/><stop offset="1" stop-color="#3ab0f5" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#b)"/><rect width="1600" height="900" fill="url(#g)"/>
  <!-- circuit / AI node network, left side -->
